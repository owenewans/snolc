wire_version = 1

[paths]
packages = "../packages"
state = "../state"

[engine]
max_sessions = 2
max_flows = 32
max_pending_sessions = 2
max_pending_opens = 8
max_managed_bytes = 33554432
max_commands = 64
max_events = 256
max_io_chunk = 16384
max_ingress_packets_per_tick = 32
connect_timeout_ms = 15000
handshake_timeout_ms = 15000
shutdown_timeout_ms = 5000

[stack]
ipv4 = true
ipv6 = true
mtu = 1280
tcp_socket_rx_bytes = 16384
tcp_socket_tx_bytes = 16384
udp_socket_rx_bytes = 131072
udp_socket_tx_bytes = 131072
udp_metadata_slots = 8
packet_queue_bytes = 262144
max_udp_payload_bytes = 65507
reassembly_slots = 4
reassembly_timeout_ms = 15000

[yamux]
max_streams_per_session = 17
receive_window_bytes = 4456448
split_send_size = 16384
read_after_close = true

[logging]
mode = "file"
source = "toml"
levels = ["warning", "error", "debug"]
file = "../state/snolc.log"
limit = "8mb"
queue_bytes = 65536
max_record_bytes = 2048
flush_interval_ms = 1000
on_io_error = "event"

[control]
mode = "unix"
path = "../state/snolc.sock"
max_request_bytes = 65536
max_connections = 4

[[tunnels]]
name = "main"
role = "server"
adapters = ["modules/direct.toml"]
protection = "modules/noise.toml"
carrier = "modules/tcp.toml"
policy = "modules/policy.toml"
