[workspace]
resolver = "3"
members = [
  "crates/snolc-abi",
  "crates/snolc-sdk",
  "crates/snolc",
  "crates/snolc-cli",
]

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.98.1"
authors = ["Owen Ewans <owenewans@tuta.io>"]
license = "Unlicense"
repository = "https://github.com/owenewans/snolc"

[workspace.dependencies]
async-executor = "=1.14.0"
async-io = "=2.6.0"
crossbeam-queue = "=0.3.12"
ctrlc = "=3.5.2"
futures = "=0.3.34"
libloading = "=0.9.0"
libc = "=0.2.189"
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
smoltcp = { version = "=0.14.0", default-features = false }
thiserror = "=2.0.20"
toml = "=1.1.6"
yamux = "=0.14.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
