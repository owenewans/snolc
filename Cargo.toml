[workspace]
resolver = "3"
members = [
  "crates/snolc-abi",
  "crates/snolc-sdk",
  "crates/snolc",
  "crates/snolc-cli",
  "modules/adapter-socks5",
  "modules/adapter-http-connect",
  "modules/adapter-direct",
  "modules/adapter-tun",
  "modules/protection-dummy",
  "modules/policy-dummy",
  "modules/carrier-tcp",
  "modules/carrier-ssh",
  "modules/protection-noise",
  "modules/policy-local",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.98.1"
authors = ["Owen Ewans <owenewans@tuta.io>"]
license = "Unlicense"
repository = "https://github.com/owenewans/snolc"

[workspace.dependencies]
async-executor = "=1.14.0"
async-io = "=2.6.0"
crossbeam-queue = "=0.3.12"
ctrlc = "=3.5.2"
ed25519-dalek = "=3.0.0"
flate2 = "=1.1.2"
futures = "=0.3.34"
getrandom = "=0.3.4"
gix = { version = "=0.87.1", default-features = false }
libloading = "=0.9.0"
libc = "=0.2.189"
postcard = { version = "=1.1.3", features = ["alloc"] }
redb = "=4.3.0"
rand = "=0.10.2"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
sha2 = "=0.10.9"
smoltcp = { version = "=0.14.0", default-features = false }
snow = "=0.10.0"
tar = "=0.4.44"
thiserror = "=2.0.20"
toml = "=1.1.6"
tokio = { version = "=1.53.1", features = ["io-util", "net", "rt", "sync", "time"] }
yamux = "=0.14.0"
zeroize = "=1.9.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"
strip = "symbols"
