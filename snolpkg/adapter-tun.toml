name = "owenewans/adapter-tun"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["adapter"]
family = "tun"
roles = ["client"]
entry = "lib/libsnolc_adapter_tun.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "dc4432b62ced51953beb662d6879beec2128486d"

[build]
package = "snolc-adapter-tun"

[[templates]]
role = "client"
source = "config/templates/modules/tun-linux.toml"
targets = ["x86_64-unknown-linux-gnu"]

[[templates]]
role = "client"
source = "config/templates/modules/tun-android.toml"
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 291975
sha256 = "b9c48964863ea7dba65e297fe4ad91c0ca4ac3ba6f13fca8f26cd6ea0a593555"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 287287
sha256 = "93942dafa454bdf4cb82d5382e29576123788579f22af66f9b27bfd415aadfab"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 258298
sha256 = "7d1a64bbafaee41bd047e11cc2847a958433126227691abca906ad14df496282"
build_output = "release/libsnolc_adapter_tun.so"
