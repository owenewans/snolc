name = "owenewans/adapter-tun"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["adapter"]
family = "tun"
roles = ["client"]
entry = "lib/libsnolc_adapter_tun.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "83aadeda5c5ae26f27588b64b67a04b3584b31c6"

[build]
package = "snolc-adapter-tun"

[[templates]]
role = "client"
source = "config/templates/modules/tun-linux.toml"
targets = ["x86_64-unknown-linux-gnu"]

[[templates]]
role = "client"
source = "config/templates/modules/tun-android.toml"
targets = ["aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client"]
capabilities = ["tun", "packet-port"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 289102
sha256 = "dfaeae29e0d30152a44d3b3c2c02d0b74e849138c248dde09932e2353d0790a9"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 287297
sha256 = "bf8b0ceea3ba5d339e7c37ec16a8e1590ba051c7c354a1d7ee595ee9ec597a26"
build_output = "release/libsnolc_adapter_tun.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-tun-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 258297
sha256 = "54ddab6736d50b244248bb4f970aa639ff85493893d771ff24e0fcebc0dadc45"
build_output = "release/libsnolc_adapter_tun.so"
