name = "owenewans/policy-local"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["policy"]
family = "local"
roles = ["client", "server"]
entry = "lib/libsnolc_policy_local.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "83aadeda5c5ae26f27588b64b67a04b3584b31c6"

[build]
package = "snolc-policy-local"

[[templates]]
role = "client"
source = "config/templates/modules/policy-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/policy.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-local-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 1036311
sha256 = "9c4bdaae6f3af7edb12822dff6f025296b219362c01d38ebb64adead5f7485be"
build_output = "release/libsnolc_policy_local.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-local-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 948758
sha256 = "797ce58ecb2a240e6e2b662d5a972a05520265e461b43158b73fd1d8de35f033"
build_output = "release/libsnolc_policy_local.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-local-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 866930
sha256 = "ca040b1b6b738af76b88d6421f7c4d56ad7131a21cad1afd6e6a8dd33ae57846"
build_output = "release/libsnolc_policy_local.so"
