name = "owenewans/policy-dummy"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["policy"]
family = "dummy"
roles = ["client", "server"]
entry = "lib/libsnolc_policy_dummy.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "83aadeda5c5ae26f27588b64b67a04b3584b31c6"

[build]
package = "snolc-policy-dummy"

[[templates]]
role = "client"
source = "config/templates/modules/policy-dummy.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/policy-dummy-server.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["session", "flow", "pump"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-dummy-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 279022
sha256 = "00213942ff3994c84f6c78b58902e546bea2718ff896bc94f8a48b9fbd121b0a"
build_output = "release/libsnolc_policy_dummy.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-dummy-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 278261
sha256 = "f69b3c33081bdbcd327d616afe6881403a4c813f8f70b12749801b6be4d48fb8"
build_output = "release/libsnolc_policy_dummy.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-dummy-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 254334
sha256 = "1453a30bf9da02ce90d6b69f1b6856e7d9ed3f04925cf0fc9c74552f81fb764b"
build_output = "release/libsnolc_policy_dummy.so"
