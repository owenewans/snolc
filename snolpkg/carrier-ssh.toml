name = "owenewans/carrier-ssh"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["carrier"]
family = "ssh"
roles = ["client", "server"]
entry = "lib/libsnolc_carrier_ssh.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "83aadeda5c5ae26f27588b64b67a04b3584b31c6"

[build]
package = "snolc-carrier-ssh"

[[templates]]
role = "client"
source = "config/templates/modules/ssh-client.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[templates]]
role = "server"
source = "config/templates/modules/ssh.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 1623686
sha256 = "6cf5d2e96a857e0822bf43b17026e3d70dcf72b33fdf4895bdc5d025c8267c03"
build_output = "release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 1520804
sha256 = "4ef8536417f1684824849e0ccd2ae7684579ee654a05237607cb57fcd0a769b4"
build_output = "release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 1401575
sha256 = "1595f00498b516c8894312e47365dbaf8f817c0df83fc7dc97970abfb79d4f41"
build_output = "release/libsnolc_carrier_ssh.so"
