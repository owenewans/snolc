name = "owenewans/adapter-http-connect"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["adapter"]
family = "http-connect"
roles = ["client"]
entry = "lib/libsnolc_adapter_http_connect.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "dc4432b62ced51953beb662d6879beec2128486d"

[build]
package = "snolc-adapter-http-connect"

[[templates]]
role = "client"
source = "config/templates/modules/http-connect.toml"
targets = ["x86_64-unknown-linux-gnu", "aarch64-linux-android", "armv7-linux-androideabi"]

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client"]
capabilities = ["connect", "ipv4", "ipv6", "domain"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-http-connect-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 297688
sha256 = "9c488597fc8458da7f3b842ab63d7cb8d72b3a285f350caf973f6ee631b6dec2"
build_output = "release/libsnolc_adapter_http_connect.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-http-connect-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 292157
sha256 = "da51bc20d63c71dc169b81bf05c921b5c54652780302b4df8276ec88329a0a2f"
build_output = "release/libsnolc_adapter_http_connect.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/adapter-http-connect-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 264423
sha256 = "dce2a4272bf83358f328ba0c3078a8d7821f1fb2b631846d096baf0cdcaebb32"
build_output = "release/libsnolc_adapter_http_connect.so"
