name: release targets

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/debian@sha256:32220ea48be72979c9f0810d69f3de9145c9584c2ee966c6ec26edbcf4640c0b
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: linux-i586
            target: i586-unknown-linux-gnu
            apt: gcc-multilib
            linker: gcc
            rustflags: -C target-feature=+sse,+sse2 -C link-arg=-m32
          - profile: linux-i686
            target: i686-unknown-linux-gnu
            apt: gcc-multilib
            linker: gcc
            rustflags: -C link-arg=-m32
          - profile: linux-x86_64
            target: x86_64-unknown-linux-gnu
            apt: gcc
            linker: gcc
            rustflags: ""
          - profile: linux-aarch64
            target: aarch64-unknown-linux-gnu
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
            rustflags: ""
          - profile: linux-armv7
            target: armv7-unknown-linux-gnueabihf
            apt: gcc-arm-linux-gnueabihf
            linker: arm-linux-gnueabihf-gcc
            rustflags: ""
          - profile: linux-riscv64gc
            target: riscv64gc-unknown-linux-gnu
            apt: gcc-riscv64-linux-gnu
            linker: riscv64-linux-gnu-gcc
            rustflags: ""
    steps:
      - name: install build tools
        run: |
          printf '%s\n' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20240612T000000Z buster main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian-security/20240612T000000Z buster/updates main' \
            'deb [check-valid-until=no] http://snapshot.debian.org/archive/debian/20240612T000000Z buster-updates main' \
            > /etc/apt/sources.list
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes build-essential ca-certificates curl git python3 pkg-config cmake libegl1-mesa-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev ${{ matrix.apt }}
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: install pinned Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSfO https://static.rust-lang.org/rustup/archive/1.28.2/x86_64-unknown-linux-gnu/rustup-init
          echo '20a06e644b0d9bd2fbdbfd52d42540bdde820ea7df86e92e533c073da0cdd43c  rustup-init' | sha256sum -c
          chmod +x rustup-init
          ./rustup-init -y --default-toolchain 1.98.1 --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: install target
        run: rustup target add ${{ matrix.target }}
      - name: build CLI, library, and modules
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --workspace --exclude snolc-ng --release --locked --target ${{ matrix.target }} --config 'target.${{ matrix.target }}.linker="${{ matrix.linker }}"'
      - name: build desktop client
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --package snolc-ng --release --locked --target ${{ matrix.target }}
      - name: verify glibc ceiling
        run: python3 tools/check-glibc.py --maximum 2.28 target/${{ matrix.target }}/release
      - name: package product bundle
        run: python3 tools/package-release.py --source . --dist dist --bundle-output ${{ matrix.target }}=target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  apple:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
          - profile: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - run: python tools/package-release.py --source . --dist dist --bundle-output ${{ matrix.target }}=target/${{ matrix.target }}/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rustup target add x86_64-pc-windows-msvc
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-msvc
      - run: python tools/package-release.py --source . --dist dist --bundle-output x86_64-pc-windows-msvc=target/x86_64-pc-windows-msvc/release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-x86_64-msvc
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  static-cross-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: freebsd-x86_64
            target: x86_64-unknown-freebsd
          - profile: freebsd-arm64
            target: aarch64-unknown-freebsd
          - profile: netbsd-x86_64
            target: x86_64-unknown-netbsd
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - run: rustup target add ${{ matrix.target }}
      - name: check portable core
        run: cargo check --locked --target ${{ matrix.target }} -p snolc-abi -p snolc-sdk -p snolc
