name: bsd

on:
  workflow_dispatch:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  freebsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            profile: freebsd-x86_64
          - arch: aarch64
            profile: freebsd-aarch64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: vmactions/freebsd-vm@4469451fe39bee80be4066836c5170362e9349f3
        with:
          release: "14.0"
          arch: ${{ matrix.arch }}
          prepare: pkg install -y curl ca_root_nss
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
            . "$HOME/.cargo/env"
            cargo build --workspace --exclude snolc-ng --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: |
            target/release/snolc
            target/release/snolpkg
            target/release/libsnolc_*.so
          if-no-files-found: error
          retention-days: 7

  openbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            profile: openbsd-x86_64
          - arch: aarch64
            profile: openbsd-aarch64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530
        with:
          release: "7.7"
          arch: ${{ matrix.arch }}
          prepare: pkg_add curl
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
            . "$HOME/.cargo/env"
            cargo build --workspace --exclude snolc-ng --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: |
            target/release/snolc
            target/release/snolpkg
            target/release/libsnolc_*.so
          if-no-files-found: error
          retention-days: 7

  netbsd:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            profile: netbsd-x86_64
          - arch: aarch64
            profile: netbsd-aarch64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: vmactions/netbsd-vm@20ee93a005c9fc78743e6e05269f4cb023b87413
        with:
          release: "10.0"
          arch: ${{ matrix.arch }}
          prepare: /usr/sbin/pkg_add curl mozilla-rootcerts-openssl
          run: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.98.1 --profile minimal
            . "$HOME/.cargo/env"
            cargo build --workspace --exclude snolc-ng --release --locked
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.profile }}
          path: |
            target/release/snolc
            target/release/snolpkg
            target/release/libsnolc_*.so
          if-no-files-found: error
          retention-days: 7
