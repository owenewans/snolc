name = "owenewans/policy-local"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["policy"]
family = "local"
roles = ["client", "server"]
entry = "lib/libsnolc_policy_local.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "dc4432b62ced51953beb662d6879beec2128486d"

[build]
package = "snolc-policy-local"

[[templates]]
role = "client"
source = "config/templates/modules/policy-client.toml"

[[templates]]
role = "server"
source = "config/templates/modules/policy.toml"

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["users", "credentials", "quota", "rate", "rules", "redb"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/policy-local-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
