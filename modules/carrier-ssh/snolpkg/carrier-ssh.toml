name = "owenewans/carrier-ssh"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["carrier"]
family = "ssh"
roles = ["client", "server"]
entry = "lib/libsnolc_carrier_ssh.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "dc4432b62ced51953beb662d6879beec2128486d"

[build]
package = "snolc-carrier-ssh"

[[templates]]
role = "client"
source = "config/templates/modules/ssh-client.toml"

[[templates]]
role = "server"
source = "config/templates/modules/ssh.toml"

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["connect", "listen", "password", "ed25519", "host-key-pin"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 1625000
sha256 = "f6130fd110fad864a59f2cd46733f1c23609b7213ec369de0e59193cf89793a3"
build_output = "release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "aarch64-linux-android"
minimum_isa = "armv8-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-aarch64-linux-android.tar.gz"
byte_size = 1520973
sha256 = "13c6599476f67f6c1bbe0f2b3a2661d64b2492c266a7ab40e0fa5c025d7653ea"
build_output = "aarch64-linux-android/release/libsnolc_carrier_ssh.so"

[[artifacts]]
target = "armv7-linux-androideabi"
minimum_isa = "armv7-a"
minimum_android_api = 24
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-ssh-0.0.1-armv7-linux-androideabi.tar.gz"
byte_size = 1401456
sha256 = "397c290411422eac3d6fa686c90a31ef88d2cde711eedb029ef5d799a054aa0a"
build_output = "armv7-linux-androideabi/release/libsnolc_carrier_ssh.so"
