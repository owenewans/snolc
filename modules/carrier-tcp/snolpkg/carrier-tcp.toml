name = "owenewans/carrier-tcp"
authors = ["Owen Ewans"]
license = "Unlicense"
package_version = "0.0.1"
wire_version = 1
classes = ["carrier"]
family = "tcp"
roles = ["client", "server"]
entry = "lib/libsnolc_carrier_tcp.so"
toolchain = "1.98.1"
dependencies = []

[source]
revision = "dc4432b62ced51953beb662d6879beec2128486d"

[build]
package = "snolc-carrier-tcp"

[[templates]]
role = "client"
source = "config/templates/modules/tcp-client.toml"

[[templates]]
role = "server"
source = "config/templates/modules/tcp.toml"

[[platforms]]
target = "x86_64-unknown-linux-gnu"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[platforms]]
target = "aarch64-linux-android"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[platforms]]
target = "armv7-linux-androideabi"
roles = ["client", "server"]
capabilities = ["connect", "listen", "tcp"]

[[artifacts]]
target = "x86_64-unknown-linux-gnu"
minimum_isa = "x86-64"
minimum_libc = "2.28"
url = "https://github.com/owenewans/snolc/releases/download/v0.0.1/carrier-tcp-0.0.1-x86_64-unknown-linux-gnu.tar.gz"
byte_size = 342644
sha256 = "3a46d13bbdc71eeed566a75ab2cbbc7e2a816fdf089df0c16c0d0ea09ce6c940"
build_output = "release/libsnolc_carrier_tcp.so"

